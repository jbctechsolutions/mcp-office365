name: Deploy Remote Connector

# Builds the connector container image and publishes it to the JP Azure Container
# Registry, then rolls each environment's Container App to the new image and
# health-gates it. Mirrors the JP deploy pattern (OIDC to Azure, no stored
# credentials; SHA-tagged immutable images).
#
# Branch-driven promotion, matching the JP staging/production split:
#
#   canonical/main --gh repo sync--> fork/dev  --> staging
#                                       |  PR (the promotion gate)
#                                       v
#                                   fork/main --> production
#
# `dev` is the fork's integration branch and the target of `gh repo sync` from
# jbctechsolutions/mcp-office365. Promotion to production is the dev -> main PR;
# there is deliberately no GitHub environment approval on top of it, because the
# PR review IS the gate and two gates for one promotion is just friction.
#
# Production previously had NO job here at all — this workflow hardcoded the
# staging Container App, so prod sat on its 2026-07-19 bootstrap image, looked
# unused, and was torn down on 2026-09-01 while an ELT member still had its URL
# saved as their claude.ai connector.
#
# Note: prod does not run the byte-identical image staging proved. Each branch
# builds its own SHA-tagged image, so a dev -> main merge commit produces a new
# digest from the same tree. That is the accepted tradeoff of branch-driven
# promotion; if prod ever needs digest-exact promotion, retag the dev image
# rather than rebuilding on main.
#
# Prerequisites (one-time):
#   - Repo variables: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#     (a workload-identity federation to a service principal with AcrPush on
#     jpcontainerregistry and Contributor on the connector resource groups).
#   - GitHub environments `staging` and `production` exist. Each job declares
#     `environment:`, so GitHub mints the OIDC token with an
#     `...:environment:<name>` subject — which is what the deploy SP's federated
#     credentials match on (jp-infrastructure stacks/azure/entra/github-oidc).
#     No per-branch credential is needed, and adding `dev` did not require an
#     OIDC change.
#   - The Container App exists (jp-infrastructure stacks/<env>/apps/
#     mcp-office365-connector applied). Until then the build-and-push job still
#     publishes the image; the deploy job self-skips.

on:
  push:
    branches: [dev, main]
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/deploy-connector.yml"
  workflow_dispatch:

# Only registry coordinates are workflow-wide. The target resource group and
# Container App are per-job — a workflow-level default here is what let the
# staging target masquerade as "the" deploy target.
env:
  ACR_NAME: jpcontainerregistry
  IMAGE_REPO: jpcontainerregistry.azurecr.io/mcp-office365-connector

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    # This deploys to the Joshua Project Azure estate, whose OIDC federation
    # trusts joshua-project/* repos only. The file is kept identical in the
    # canonical jbctechsolutions repo (so `gh repo sync` to the fork stays a
    # clean fast-forward) but only executes in the joshua-project fork.
    if: github.repository_owner == 'joshua-project'
    runs-on: ubuntu-latest
    # Tracks the branch so the OIDC subject matches the environment this run is
    # ultimately deploying to. AcrPush is granted on the SP itself, so either
    # environment can push the image — but a main-triggered run claiming the
    # staging subject would be a lie waiting to break under environment
    # protection rules.
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Resolve image tag
        id: meta
        run: echo "image=${IMAGE_REPO}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name "${ACR_NAME}"

      - name: Build image
        run: docker build --platform linux/amd64 -t "${{ steps.meta.outputs.image }}" -t "${IMAGE_REPO}:latest" .

      - name: Push image (sha + latest)
        run: |
          docker push "${{ steps.meta.outputs.image }}"
          docker push "${IMAGE_REPO}:latest"

  deploy-staging:
    if: github.repository_owner == 'joshua-project' && github.ref == 'refs/heads/dev'
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: staging
    env:
      RESOURCE_GROUP: rg-jp-mcp-office365-staging
      CONTAINER_APP_NAME: jp-mcp-office365-staging
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Roll the Container App to the new image
        id: roll
        run: |
          set -euo pipefail
          if ! az containerapp show -n "${CONTAINER_APP_NAME}" -g "${RESOURCE_GROUP}" >/dev/null 2>&1; then
            echo "::notice::Container App ${CONTAINER_APP_NAME} not found — image published, skipping roll. Apply the jp-infrastructure stack first."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          az containerapp update \
            --name "${CONTAINER_APP_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --image "${{ needs.build-and-push.outputs.image }}"
          echo "skipped=false" >> "$GITHUB_OUTPUT"

      - name: Health-gate the new revision
        if: steps.roll.outputs.skipped == 'false'
        run: |
          set -euo pipefail
          FQDN=$(az containerapp show -n "${CONTAINER_APP_NAME}" -g "${RESOURCE_GROUP}" \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "Health-checking https://${FQDN}/healthz"
          for attempt in $(seq 1 30); do
            if curl -fsS "https://${FQDN}/healthz" | grep -q '"status":"ok"'; then
              echo "Container App is healthy."
              exit 0
            fi
            echo "Not ready yet (attempt ${attempt}/30)..."
            sleep 10
          done
          echo "Container App did not become healthy within 5 minutes."
          exit 1

  deploy-production:
    # Runs only on main. The gate is the dev -> main PR, not an approval prompt
    # here — so this job does NOT need deploy-staging: that job belongs to a
    # different branch's run and never executes in a main-triggered run.
    if: github.repository_owner == 'joshua-project' && github.ref == 'refs/heads/main'
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    env:
      RESOURCE_GROUP: rg-jp-mcp-office365-production
      CONTAINER_APP_NAME: jp-mcp-office365-production
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Roll the Container App to the new image
        id: roll
        run: |
          set -euo pipefail
          if ! az containerapp show -n "${CONTAINER_APP_NAME}" -g "${RESOURCE_GROUP}" >/dev/null 2>&1; then
            echo "::notice::Container App ${CONTAINER_APP_NAME} not found — image published, skipping roll. Apply the jp-infrastructure stack first."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          az containerapp update \
            --name "${CONTAINER_APP_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --image "${{ needs.build-and-push.outputs.image }}"
          echo "skipped=false" >> "$GITHUB_OUTPUT"

      - name: Health-gate the new revision
        if: steps.roll.outputs.skipped == 'false'
        run: |
          set -euo pipefail
          # Deliberately NOT a public curl like the staging job does. Production
          # ingress is (or will be) locked to Anthropic's egress range — a GitHub
          # runner is not in it, so curling /healthz would fail for an app that is
          # perfectly healthy. Everything below is control-plane state, so it stays
          # truthful whether or not ingress is restricted.
          #
          # The success signal is REPLICA READINESS, not the revision's healthState.
          # healthState is populated lazily on a freshly created revision: on the
          # 2026-09-14 first production roll it was still empty 5 minutes after the
          # revision went RunningAtMaxScale, and only filled in later — so gating on
          # it failed a deploy that had in fact succeeded. Replica `ready` is the
          # readiness probe's result directly and is populated as soon as the probe
          # passes. healthState is kept only as an early-exit fast path.
          REV=$(az containerapp show -n "${CONTAINER_APP_NAME}" -g "${RESOURCE_GROUP}" \
            --query properties.latestRevisionName -o tsv)
          echo "Health-gating revision ${REV}"
          # runningState is NOT simply "Running" — a healthy single-replica app
          # reports "RunningAtMaxScale". It is used only to fail fast, never as the
          # success condition.
          for attempt in $(seq 1 40); do
            read -r RUNNING HEALTH < <(az containerapp revision show \
              -n "${CONTAINER_APP_NAME}" -g "${RESOURCE_GROUP}" --revision "${REV}" \
              --query "[properties.runningState, properties.healthState]" -o tsv)

            # Replicas not ready / not yet scheduled -> READY is 0, never unset.
            READY=$(az containerapp replica list \
              -n "${CONTAINER_APP_NAME}" -g "${RESOURCE_GROUP}" --revision "${REV}" \
              --query "length([?length(properties.containers[?ready!=\`true\`])==\`0\`])" -o tsv 2>/dev/null || echo 0)
            READY=${READY:-0}

            echo "runningState=${RUNNING} healthState=${HEALTH:-<unset>} readyReplicas=${READY} (attempt ${attempt}/40)"

            case "${RUNNING}" in
              Failed|Degraded|Stopped)
                echo "Revision ${REV} is in terminal state ${RUNNING}."
                exit 1
                ;;
            esac

            if [ "${READY}" -ge 1 ]; then
              echo "Production revision ${REV} has ${READY} ready replica(s) — healthy."
              exit 0
            fi
            if [ "${HEALTH}" = "Healthy" ]; then
              echo "Production revision ${REV} reports healthState=Healthy."
              exit 0
            fi
            sleep 10
          done
          echo "Production revision did not become ready within ~7 minutes."
          az containerapp replica list -n "${CONTAINER_APP_NAME}" -g "${RESOURCE_GROUP}" \
            --revision "${REV}" -o json || true
          exit 1
